# Drop-in for mm-control.service (the unit file itself is unchanged).
# The dashboard may only run while the persistent log storage is mounted.
# If logs.img fails to mount, mm-control does not start ("Dependency failed"),
# so it can never save logs into the folder underneath (or, later, into RAM).
[Unit]
RequiresMountsFor=/home/multimeter/pi_multimeter/logs

[Service]
# Also refuse to start if something other than the ext4 log image is mounted there
# (e.g. a RAM overlay), so logs can never silently go to temporary storage.
ExecStartPre=/bin/sh -c 'findmnt -n -o FSTYPE --mountpoint /home/multimeter/pi_multimeter/logs | grep -qx ext4'
